    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <header class="py-10">
      <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
        <nav class="relative z-50 flex justify-between">
          <div class="flex items-center md:gap-x-12">
            <a aria-label="Home" href="#">
              <h2 class="font-black text-2xl text-blue-600">A<span class="text-black">R</span>  </h2>
            </a>
          </div>
          <div class="flex items-center gap-x-5 md:gap-x-8">
            <p
              class="inline-block rounded-lg px-2 py-1 text-sm text-slate-700 hover:bg-slate-100 hover:text-slate-900 font-semibold"
              id="user-email"
            ></p>

            <button
              class="group inline-flex items-center justify-center rounded-full py-2 px-4 text-sm font-semibold focus:outline-none focus-visible:outline-2 focus-visible:outline-offset-2 bg-blue-600 text-white hover:text-slate-100 hover:bg-blue-500 active:bg-blue-800 active:text-blue-100 focus-visible:outline-blue-600"
              id="signout-button"
              variant="solid"
            >
              Logout
            </button>
          </div>
        </nav>
      </div>
    </header>

    <div
      class="mt-10 mx-auto max-w-5xl w-fit border-2 bg-gray-100 px-2 py-4 rounded-xl sm:w-fit"
    >
      <div
        class="md:max-w-5xl flex md:flex-row sm:max-w-2xl gap-1.5 justify-center items-center content-center px-2"
      >
        <input
          type="text"
          name="product-name"
          id="product-name"
          placeholder="Product Name"
          class="block rounded-md border-0 px-2 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6"
        />

        <input
          type="number"
          name="product-price"
          id="product-price"
          placeholder="Product Price"
          class="block rounded-md border-0 px-2 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6"
        />
        <input
          type="text"
          name="product-description"
          id="product-description"
          placeholder="Product Description"
          class="block rounded-md border-0 px-2 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6"
        />

        <input type="file" name="" id="product-image" class="w-56"/>

        <button
          class="group inline-flex items-center justify-center rounded-full py-2 px-4 text-sm font-semibold focus:outline-none focus-visible:outline-2 focus-visible:outline-offset-2 bg-blue-600 text-white hover:text-slate-100 hover:bg-blue-500 active:bg-blue-800 active:text-blue-100 focus-visible:outline-blue-600"
          id="add-product-btn"
          color="blue"
          variant="solid"
        >
          Add Product
        </button>
      </div>
    </div>

    <div class="bg-white">
      <div class="mx-auto max-w-2xl px-4 py-16 sm:px-6 sm:py-24 lg:max-w-7xl lg:px-8" id="result">
    
        <div class="mt-6 grid grid-cols-1 gap-x-6 gap-y-10 sm:grid-cols-2 lg:grid-cols-4 xl:gap-x-8">
          <div class="group relative">
            <!-- <div class="aspect-h-1 aspect-w-1 w-full overflow-hidden rounded-md bg-gray-200 lg:aspect-none group-hover:opacity-75 lg:h-80" id="res-product-div">
              <img src="" alt="" class="h-full w-full object-cover object-center lg:h-full lg:w-full" id="res-product-image">
            </div> -->
            <div class="mt-4 flex justify-between">
              <div>
                <h3 class="text-sm text-gray-700">
                  <a href="#">
                    <span aria-hidden="true" class="absolute inset-0" id="res-product-name"></span> 
                  </a>
                </h3>
                <p class="mt-1 text-sm text-gray-500" id="res-product-description"></p>
              </div>
              <p class="text-sm font-medium text-gray-900" id="res-product-price"></p>
            </div>
          </div>
    
        </div>
      </div>
    </div>

    <script type="module" src="../scripts/dashboard.js"></script>
